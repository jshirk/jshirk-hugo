# Site settings
languageCode: "en-us"
title: "Jordan Shirkman | The Useful Life"
theme: "PaperMod" # My Hugo Theme
enableRobotsTXT: true   # layouts/robots.txt
baseURL: "https://jshirk.com/"

## Permalinks show up under /blog
permalinks:
  blog: "/blog/:slug/"

# Site Parameters
params:
  author: "Jordan Shirkman"   # one identity for meta tags, feeds, and structured data
  defaultTheme: auto
  description: "Pursue wisdom. Master the ordinary. Leave a legacy."
  disableAnchoredHeadings: true
  enableEmoji: true
  latest_posts_count: 5
  mainSections: ["blog"]
  show_latest_posts: true
  showtoc: true
  ShowBreadCrumbs: true
  ShowFullTextinRSS: true
  ShowPostNavLinks: true
  ShowReadingTime: true
  ShowWordCount: false
  tagline: "The Useful Life"
  logo:
    # The header mark is static/images/logo-mark.png, drawn in the text colour by CSS
    text: "Jordan Shirkman | The Useful Life"

  assets:
    favicon: "favicon.ico"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # Social Icons on Home Page     
  socialIcons: 
    - name: "x"
      url: "https://x.com/jshirk"
    - name: "instagram"
      url: "https://instagram.com/jshirk"
    - name: "facebook"
      url: "https://facebook.com/jshirk"
    - name: "email"
      url: "mailto:jshirkman@gmail.com"


relativeURLs: false
canonifyURLs: true

markup:
  goldmark:
    extensions:
      footnote: true
    renderer:
      unsafe: true

# Navigation Menu
menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Blog"
      url: "/blog/"
      weight: 2
    - name: "About"
      url: "/about/"
      weight: 3
    - name: "Contact"
      url: "/contact/"
      weight: 4
    - name: "Tools"
      url: "/tools/"
      weight: 5
    - name: "🔍"
      url: "/search/"
      weight: 6

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON