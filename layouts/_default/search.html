{{- define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}
  <p class="post-description">{{ . }}</p>
  {{- end }}
</header>

{{- $index := site.Home.OutputFormats.Get "json" }}
<div class="article-search" data-search-index="{{ $index.RelPermalink }}">
  <label for="searchInput">Search articles</label>
  <input id="searchInput" placeholder="{{ .Params.placeholder }}" type="search" autocomplete="off" maxlength="64">
  <p id="search-status" role="status"></p>
  <ul id="article-search-results" aria-label="Search results"></ul>
  <noscript><p>Search requires JavaScript. <a href="{{ (site.GetPage "/archive").RelPermalink }}">Browse the archive</a>.</p></noscript>
</div>
{{- end }}
